<body>
<!--behavior marquee : slide, scroll, altetnate-->
kembali ke <a href="link3.html">link bagian bawah</a>
<marquee>Selamat Datang</marquee>
<marquee behavior="slide" direction="right">Marquee dengan behavior slide</marquee>
<a name="atas"></a>
<marquee behavior="scroll" direction="left">Marquee dengan behavior scroll</marquee>
<marquee behavior="alternate">Marquee dengan behavior alternate</Marquee>
<marquee behavior="scroll" direction="up">Your upward scroling text goes here</marquee>
<marquee behavior="scroll" direction="left" scrollamount="1">marquee dengan behavior scroll slow</marquee>
<marquee behavior="scroll" direction="left" scrollamount="10">Marquee dengan behavior scroll medium</marquee>
<marquee behavior="scroll" direction="left" scrollamount="20">marquee dengan behavior scroll fast</marquee>
